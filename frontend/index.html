  <meta charset="UTF-8" data-page-node-id="JxJDB768FQsbAcQ7Uml4je" />

  <title>AI 营销素材生成工具</title>
  <style>
    :root {
      --bg: #faf7f2;
      --card: #ffffff;
      --ink: #2d2a26;
      --muted: #a39a8e;
      --accent: #cd785c;
      --accent-2: #3d4d6b;
      --accent-soft: #f7ece5;
      --ok: #5aae72;
      --warn: #cd785c;
      --border: #ece5da;
      --shadow: 0 1px 3px rgba(45,42,38,.04), 0 8px 24px rgba(45,42,38,.05);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "PingFang SC", "Hiragino Sans GB", "Yuanti SC", "YouYuan",
                   "Microsoft YaHei", "Noto Sans SC", -apple-system, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.85;
      letter-spacing: .2px;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 1020px; margin: 0 auto; padding: 48px 20px 96px; }

    header { text-align: center; margin-bottom: 40px; }
    header .logo {
      display: inline-flex; align-items: center; gap: 10px;
      margin-bottom: 8px;
    }
    header .logo .dot {
      width: 38px; height: 38px; border-radius: 14px;
      background: linear-gradient(135deg, #cd785c, #d98e6a);
      display: inline-flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; font-size: 20px;
    }
    header h1 { font-size: 26px; letter-spacing: 1px; font-weight: 700; }
    header p { color: var(--muted); margin-top: 8px; font-size: 14.5px; }
    .badge {
      display: inline-block; padding: 4px 12px; border-radius: 999px;
      font-size: 12px; margin-top: 12px; font-weight: 500;
    }
    .badge.on { background: var(--accent-2); color: #fff; }
    .badge.off { background: #f7ece5; color: var(--warn); }

    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 20px; padding: 32px; margin-bottom: 24px;
      box-shadow: var(--shadow);
    }
    .card h2 {
      font-size: 17px; font-weight: 600; margin-bottom: 24px;
      display: flex; align-items: center; gap: 12px;
    }
    .card h2 .step {
      width: 28px; height: 28px; background: var(--accent); color: #fff;
      border-radius: 9px; display: inline-flex; align-items: center;
      justify-content: center; font-size: 14px; font-weight: 700; flex-shrink: 0;
    }
    .card h2 .step.plain { background: var(--accent-2); }

    label { font-size: 13.5px; color: var(--muted); display: block; margin: 18px 0 8px; font-weight: 500; }
    label .req { color: var(--accent); }
    input[type="text"], textarea {
      width: 100%; padding: 13px 16px; border: 1.5px solid var(--border);
      border-radius: 12px; font-size: 15px; font-family: inherit;
      transition: border-color .15s, box-shadow .15s; background: #fff;
    }
    input:focus, textarea:focus {
      outline: none; border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    textarea { resize: vertical; min-height: 72px; }

    .file-drop {
      border: 2px dashed var(--border); border-radius: 16px;
      padding: 36px; text-align: center; color: var(--muted); cursor: pointer;
      transition: all .2s; background: #f7f2ea;
    }
    .file-drop:hover, .file-drop.drag { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
    .file-drop img { max-width: 100%; max-height: 200px; margin-top: 12px; border-radius: 10px; }

    .row { display: flex; gap: 16px; }
    .row > div { flex: 1; }

    .btn-group { display: flex; gap: 14px; margin-top: 30px; flex-wrap: wrap; }
    button.primary {
      flex: 1; min-width: 170px; padding: 15px 18px;
      color: #fff; border: none; border-radius: 14px;
      font-size: 15px; font-weight: 600; cursor: pointer;
      letter-spacing: .5px;
      transition: transform .08s, opacity .2s;
    }
    button.primary:hover { opacity: .92; }
    button.primary:active { transform: translateY(1px); }
    button.primary:disabled { opacity: .5; cursor: not-allowed; }
    #copyBtn { background: #e0a183; }
    #imgBtn { background: #d98e6a; }
    #genBtn { background: linear-gradient(135deg, #cd785c, #d98e6a); }

    .spinner {
      display: inline-block; width: 16px; height: 16px; border: 2.5px solid #fff;
      border-top-color: transparent; border-radius: 50%;
      animation: spin .8s linear infinite; vertical-align: middle; margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .hint { font-size: 12px; color: var(--muted); margin-top: 10px; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    @media (max-width: 760px) { .grid, .row, .btn-group { grid-template-columns: 1fr; flex-direction: column; } }

    .result-img {
      width: 100%; border-radius: 16px; border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }
    .copy-block {
      background: #f9f5ee; border: 1px solid var(--border); border-radius: 16px;
      padding: 18px; margin-bottom: 14px;
    }
    .copy-block h4 {
      display: flex; align-items: center; gap: 6px;
      color: var(--accent); font-size: 13px; margin-bottom: 8px; font-weight: 600;
    }
    .copy-block h4::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
    .copy-block p { font-size: 14px; white-space: pre-wrap; color: var(--ink); }

    .revise-bar {
      display: flex; gap: 10px; align-items: center;
      margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--border);
    }
    .revise-bar input { flex: 1; }
    .revise-bar button { width: auto; padding: 12px 22px; margin: 0; background: var(--accent-2); }

    .prompt-box {
      background: #f9f5ee; border: 1px solid var(--border); border-radius: 10px;
      padding: 14px; font-size: 12.5px; color: var(--muted); margin-top: 14px;
      white-space: pre-wrap; word-break: break-all; font-family: ui-monospace, monospace;
    }
    .kv { margin: 6px 0; font-size: 13px; }
    .kv b { color: var(--accent); font-weight: 600; }

    .suggest {
      position: absolute; top: 100%; left: 0; right: 0; z-index: 10;
      background: #fff; border: 1px solid var(--border); border-radius: 10px;
      box-shadow: 0 12px 32px rgba(16,24,40,.14); max-height: 260px; overflow-y: auto;
    }
    .suggest-item { padding: 11px 14px; cursor: pointer; border-bottom: 1px solid var(--border); }
    .suggest-item:last-child { border-bottom: none; }
    .suggest-item:hover { background: var(--accent-soft); }
    .suggest-item .name { font-weight: 600; font-size: 14px; }
    .suggest-item .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }

    /* 营销店长 Tab 与卡片 */
    .tabs { display: flex; gap: 10px; margin-bottom: 24px; }
    .tab {
      padding: 10px 22px; border-radius: 12px; border: 1.5px solid var(--border);
      background: #fff; color: var(--muted); font-size: 14.5px; font-weight: 600;
      cursor: pointer; transition: all .15s; font-family: inherit;
    }
    .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .agent-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 760px) { .agent-grid { grid-template-columns: 1fr; } }
    .agent-chip {
      background: var(--accent-soft); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 14px; font-size: 13.5px; color: var(--ink);
    }
    .agent-chip.ghost { opacity: .55; background: #f7f2ea; }
    .report-block {
      background: #f9f5ee; border: 1px solid var(--border); border-radius: 14px;
      padding: 18px; margin-bottom: 14px;
    }
    .report-block h4 {
      display: flex; align-items: center; gap: 6px;
      color: var(--accent-2); font-size: 14px; margin-bottom: 10px; font-weight: 600;
    }
    .report-block h4 .tag { font-size: 11px; color: var(--muted); font-weight: 400; margin-left: 4px; }
    .report-block p { font-size: 13.5px; color: var(--ink); white-space: pre-wrap; margin-bottom: 6px; }
    .report-block .reasoning { color: #5a544c; font-size: 13px; line-height: 1.8; }
    .report-block .suggest { color: #3d6b4d; font-size: 13px; }
    .rank-badge {
      display: inline-block; padding: 2px 10px; border-radius: 999px;
      font-size: 11.5px; font-weight: 600; margin-left: 6px;
    }
    .rank-hot { background: #f7ece5; color: #cd785c; }
    .rank-slow { background: #e8f0ea; color: #5aae72; }
    .plan-card {
      background: #fff; border: 1px solid var(--border); border-radius: 14px;
      padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow);
    }
    .plan-card .plan-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .plan-card .plan-name { font-weight: 700; font-size: 15px; }
    .plan-card .plan-profit { font-weight: 700; font-size: 15px; }
    .plan-card .plan-profit.pos { color: #cd785c; }
    .plan-card .plan-profit.neg { color: #5aae72; }
    .plan-metrics { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
    .plan-metrics b { color: var(--ink); font-weight: 600; }
    .interpret-box {
      background: linear-gradient(135deg, #fdf6ef, #f9f0e6);
      border: 1px solid #f0d9c5; border-radius: 14px; padding: 18px; margin-top: 8px;
    }
    .interpret-box h4 { color: var(--accent); font-size: 14px; margin-bottom: 8px; font-weight: 700; }
    .interpret-box p { font-size: 14px; color: var(--ink); line-height: 1.9; white-space: pre-wrap; }

    /* 对话式营销店长 */
    .chat-box {
      background: var(--card); border: 1px solid var(--border); border-radius: 20px;
      box-shadow: var(--shadow); overflow: hidden;
    }
    .chat-messages {
      height: 460px; overflow-y: auto; padding: 24px;
      background: #fbf9f5; display: flex; flex-direction: column; gap: 14px;
    }
    .msg { display: flex; gap: 10px; max-width: 82%; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg .avatar {
      width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; background: var(--accent-soft); border: 1px solid var(--border);
    }
    .msg.user .avatar { background: var(--accent-2); color: #fff; }
    .msg .bubble {
      background: #fff; border: 1px solid var(--border); border-radius: 14px;
      padding: 12px 16px; font-size: 14px; line-height: 1.75;
      border-top-left-radius: 4px;
    }
    .msg.user .bubble {
      background: var(--accent); color: #fff; border-color: var(--accent);
      border-radius: 14px; border-top-right-radius: 4px; border-top-left-radius: 14px;
    }
    .msg .bubble .time { font-size: 11px; opacity: .55; margin-top: 4px; }

    /* Agent 团队面板 */
    .team-panel {
      display: flex; gap: 12px; flex-wrap: wrap; padding: 16px 24px;
      border-top: 1px solid var(--border); background: #fff;
    }
    .agent-card {
      flex: 1; min-width: 150px; border: 1.5px solid var(--border); border-radius: 14px;
      padding: 14px; display: flex; align-items: center; gap: 10px;
      background: #fdfcfa; transition: all .25s;
    }
    .agent-card.hidden { display: none; }
    .agent-card.running {
      border-color: var(--accent); background: var(--accent-soft);
      box-shadow: 0 0 0 3px rgba(205,120,92,.14);
    }
    .agent-card.done {
      border-color: var(--ok); background: #f2f9f4;
    }
    /* 圆环：默认静止，只有 running 时才转 */
    .agent-card .spin {
      width: 22px; height: 22px; border-radius: 50%;
      border: 2.5px solid var(--border); border-top-color: #ddd;
      flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      font-size: 12px; color: var(--muted);
    }
    .agent-card.running .spin {
      border-top-color: var(--accent);
      animation: spin .8s linear infinite;
    }
    .agent-card.done .spin {
      border: none; background: var(--ok); color: #fff;
      animation: none; font-size: 13px;
    }
    .agent-card .name { font-weight: 600; font-size: 13.5px; }
    .agent-card .status { font-size: 11.5px; color: var(--muted); }
    .agent-card.running .status { color: var(--accent); font-weight: 600; }
    /* 店长思考链路 */
    .think-block {
      background: #f7f5f1; border-left: 3px solid var(--accent); border-radius: 8px;
      padding: 10px 14px; margin: 8px 0; font-size: 13px; color: var(--ink);
      line-height: 1.8; white-space: pre-wrap;
    }
    .think-block .think-label { color: var(--accent); font-weight: 700; font-size: 12px; letter-spacing: 1px; }

    /* 聊天输入区 */
    .chat-input-bar {
      display: flex; gap: 10px; padding: 16px 24px; border-top: 1px solid var(--border); background: #fff;
      align-items: center;
    }
    .chat-input-bar input {
      flex: 1; padding: 13px 16px; border: 1.5px solid var(--border);
      border-radius: 12px; font-size: 14.5px; font-family: inherit; background: #fff;
    }
    .chat-input-bar input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .mic-btn {
      width: 46px; height: 46px; border-radius: 50%; border: 1.5px solid var(--border);
      background: #fff; font-size: 20px; cursor: pointer; flex-shrink: 0;
      transition: all .15s; display: flex; align-items: center; justify-content: center;
    }
    .mic-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
    .mic-btn.recording { background: #cd785c; border-color: #cd785c; animation: pulse 1.2s infinite; }
    .attach-btn {
      width: 46px; height: 46px; border-radius: 12px; border: 1.5px solid var(--border);
      background: #fff; font-size: 20px; cursor: pointer; flex-shrink: 0;
      transition: all .15s; display: flex; align-items: center; justify-content: center;
    }
    .attach-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
    .attach-strip {
      display: flex; gap: 8px; flex-wrap: wrap; padding: 0 24px 12px; background: #fff;
    }
    .attach-chip {
      display: flex; align-items: center; gap: 6px; padding: 6px 10px;
      border: 1px solid var(--border); border-radius: 8px; background: var(--accent-soft);
      font-size: 12.5px; color: var(--ink); max-width: 220px;
    }
    .attach-chip img { width: 30px; height: 30px; border-radius: 6px; object-fit: cover; }
    .attach-chip .rm { cursor: pointer; color: var(--muted); font-weight: 700; margin-left: 4px; }
    .attach-chip .rm:hover { color: #cd785c; }
    .chat-input-bar.dragover { background: var(--accent-soft); }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(205,120,92,.4); }
      50% { box-shadow: 0 0 0 12px rgba(205,120,92,0); }
    }
    .send-btn {
      padding: 13px 24px; border-radius: 12px; border: none; cursor: pointer;
      background: linear-gradient(135deg, #cd785c, #d98e6a); color: #fff;
      font-size: 14.5px; font-weight: 600; font-family: inherit;
    }
    .send-btn:disabled { opacity: .5; cursor: not-allowed; }
  </style>
</head>

        <button class="primary" id="copyBtn" data-page-node-id="hRjwWQbnwfHrplXkk7QsS6">只生成文案</button>
        <button class="primary" id="imgBtn" data-page-node-id="6icCF1Cyr4AQEyRCarJH1c">只生成图片</button>
        <button class="primary" id="genBtn" data-page-node-id="eIC2eEMZLYD5J5Fy8Zq6Pp">图文一起生成</button>
      </div>
      <div class="hint" data-page-node-id="GBO4EmpZpGXbBo7ZW2zqAH">只想要文案时无需等待生图；生图较慢，可按需选择。</div>
    </div>

    <!-- 结果区 -->
    <div id="resultWrap" style="display:none" data-page-node-id="rh3ZgVWxVpVHhqDtiWxDAW">
      <div class="card" data-page-node-id="vcJSbpWmR9idGazesAgFQS">
        <h2 data-page-node-id="s7DtB4JGZpkVprnHJNGyIw"><span class="step" data-page-node-id="PY7RHBtS4Wk2s9xQRDgIB9">✓</span> 生成结果</h2>
        <div class="grid" data-page-node-id="wGUTImmM9BTBZKfYux6fAg">
          <div id="imgCol" style="display:none" data-page-node-id="Si1HzPsnj5ShK7Ut4VYuaZ">
            <label style="margin-top:0" data-page-node-id="0HA16dMSfAlDfV1xdH9Zru">生成海报</label>
            <img class="result-img" id="resultImg" data-page-node-id="N8UwkWzffDcBxwnDb9MK9a" />
          </div>
          <div id="copyCol" style="display:none" data-page-node-id="bQwOFF7Uja5hvnDXogRyye">
            <label style="margin-top:0" data-page-node-id="xNZdOJ7qBeNlRyqZ3vsgFt">营销文案</label>
            <div id="copies" data-page-node-id="lxz7TCSFcH9BotbIWMN9v4"></div>
          </div>
        </div>
        <!-- 多轮改图 -->
        <div style="margin-top:24px; padding-top:18px; border-top:1px solid var(--border)" data-page-node-id="cjD14UrSTwOAB1lZ2pIF1O">
          <label style="margin-top:0" data-page-node-id="0XYR3UkmDGC3ChHJB0yy8o">继续修改图片（多轮改图）</label>
          <div class="revise-bar" data-page-node-id="lEGvs32oWIsB6wfeC7OurO">
            <input type="text" id="reviseInput" placeholder="例如：去掉柿子和橘子，背景改成绿色调" data-page-node-id="vZ8REzfLFTv8GU5WFhIsyx" />
            <button class="primary" id="reviseBtn" data-page-node-id="KkNFqZgXLGizb3Novurqi9">修改图片</button>
          </div>
          <div class="hint" data-page-node-id="dg2KUgqSl5ZWvC15GPKCfG">不满意可反复修改：去掉多余元素、换背景色、换构图等，每次基于上一版重新生成</div>
        </div>
      </div>
      <div class="card" data-page-node-id="J6Q66FAzshqHLfrZnITL2u">
        <h2 data-page-node-id="Hi54lxqfWXYTrjkMHjDNo5"><span class="step plain" data-page-node-id="koNHoHJmfQFqXUR9gYCCAh">i</span> 提示词解析详情</h2>
        <div id="parsedDetail" data-page-node-id="L2PZTRy6CMf98pI2DlED0h"></div>
      </div>
    </div>
    </div><!-- /materialView -->
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    let currentPrompt = '';  // 当前海报的提示词，用于多轮修改
    let genAbort = null;     // 用于取消正在进行的生成请求

    // 访客 ID：浏览器本地持久化，用于额度计数
    function visitorId() {
      let id = localStorage.getItem('visitor_id');
      if (!id) {
        id = 'v_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
        localStorage.setItem('visitor_id', id);
      }
      return id;
    }
    const VID = visitorId();

    // 是否已通过密码校验
    let accessOk = false;

    // 检测 mock 模式 + 是否需要密码
    fetch('/api/health').then(r => r.json()).then(d => {
      const b = $('modeBadge');
      if (d.mock) { b.textContent = '演示模式（未配置 API Key）'; b.className = 'badge off'; }
      else { b.textContent = '已接入真实生图 API'; b.className = 'badge on'; }
      if (d.need_key) {
        askKey();
      } else {
        accessOk = true;
        refreshQuota();
      }
    }).catch(() => { const b = $('modeBadge'); b.textContent = '后端未连接'; b.className = 'badge off'; });

    // 访问密码弹层
    function askKey() {
      const key = prompt('此应用需要访问密码，请输入：');
      if (!key) { alert('未输入密码，无法使用'); askKey(); return; }
      fetch('/api/verify_key', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key: key.trim() })
      }).then(r => r.json()).then(d => {
        if (d.ok) { accessOk = true; refreshQuota(); }
        else { alert(d.reason || '密码错误'); askKey(); }
      }).catch(() => alert('网络错误，请重试'));
    }

    // 刷新额度显示
    async function refreshQuota() {
      try {
        const r = await fetch('/api/quota', { headers: { 'X-Visitor-Id': VID } });
        const d = await r.json();
        const el = $('quotaHint');
        if (d.remaining !== undefined && d.remaining !== null) {
          el.style.display = 'block';
          el.textContent = '今日剩余生成次数：' + d.remaining;
        }
      } catch (e) {}
    }

    // 产品名联想补全（从知识库检索）
    const nameInput = $('name'), suggest = $('suggest'), lookupHint = $('lookupHint');
    let suggestTimer = null;
    nameInput.addEventListener('input', () => {
      clearTimeout(suggestTimer);
      const q = nameInput.value.trim();
      if (!q) { suggest.style.display = 'none'; lookupHint.style.display = 'none'; return; }
      suggestTimer = setTimeout(async () => {
        try {
          const r = await fetch('/api/search?q=' + encodeURIComponent(q));
          const d = await r.json();
          if (d.results && d.results.length) {
            suggest.innerHTML = d.results.map(p =>
              `<div class="suggest-item" data-name="${p.name}" data-price="${p.price}" data-points="${p.selling_points}">
                <div class="name">${p.name}${p.brand ? ` <span style="font-size:12px;color:var(--muted);font-weight:400">${p.brand}</span>` : ''}</div>
                <div class="meta">${p.price || '价格待填'}${p.selling_points && p.selling_points !== (p.brand+'在售产品') ? ' · ' + p.selling_points : ''}</div>
              </div>`
            ).join('');
            suggest.style.display = 'block';
            suggest.querySelectorAll('.suggest-item').forEach(el => {
              el.addEventListener('click', () => {
                nameInput.value = el.dataset.name;
                $('price').value = el.dataset.price;
                $('points').value = el.dataset.points;
                suggest.style.display = 'none';
                lookupHint.style.display = 'block';
                lookupHint.textContent = '已从知识库填入「' + el.dataset.name + '」的价格和卖点，可自行修改';
              });
            });
          } else {
            suggest.style.display = 'none';
            lookupHint.style.display = 'none';
          }
        } catch (e) { /* 忽略 */ }
      }, 250);
    });
    document.addEventListener('click', e => {
      if (!suggest.contains(e.target) && e.target !== nameInput) suggest.style.display = 'none';
    });

    // 文件上传
    let file = null;
    const drop = $('drop'), fileInput = $('fileInput'), preview = $('preview');
    drop.addEventListener('click', () => fileInput.click());
    drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('drag'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('drag'));
    drop.addEventListener('drop', e => {
      e.preventDefault(); drop.classList.remove('drag');
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', () => { if (fileInput.files.length) handleFile(fileInput.files[0]); });
    function handleFile(f) {
      file = f;
      const reader = new FileReader();
      reader.onload = e => { preview.src = e.target.result; preview.style.display = 'block'; $('dropText').style.display = 'none'; };
      reader.readAsDataURL(f);
    }

    // 生成
    function collectForm() {
      const name = $('name').value.trim();
      const points = $('points').value.trim();
      if (!name || !points) { alert('请填写产品名称和卖点'); return null; }
      const fd = new FormData();
      fd.append('product_name', name);
      fd.append('selling_points', points);
      fd.append('price', $('price').value.trim());
      if (file) fd.append('poster', file);
      return fd;
    }

    function renderImage(data) {
      $('imgCol').style.display = 'block';
      if (data.image.base64) {
        $('resultImg').src = `data:image/${data.image.format};base64,${data.image.base64}`;
      } else if (data.image.url) {
        $('resultImg').src = data.image.url;
      }
      if (data.final_prompt) currentPrompt = data.final_prompt;
    }

    function renderCopies(data) {
      $('copyCol').style.display = 'block';
      const copies = $('copies');
      copies.innerHTML = '';
      for (const [platform, text] of Object.entries(data.copywriting)) {
        copies.innerHTML += `<div class="copy-block"><h4>${platform}</h4><p>${text}</p></div>`;
      }
    }

    function renderParsed(data) {
      if (!data.parsed_prompt) return;
      const pd = $('parsedDetail');
      pd.innerHTML = '';
      for (const [k, v] of Object.entries(data.parsed_prompt)) {
        pd.innerHTML += `<div class="kv"><b>${k}</b>：${v}</div>`;
      }
      if (data.final_prompt) pd.innerHTML += `<div class="prompt-box">最终提示词：${data.final_prompt}</div>`;
    }

    async function doCopy() {
      const fd = collectForm();
      if (!fd) return;
      const btn = $('copyBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>生成文案中…';
      try {
        const resp = await fetch('/api/copywriting', { method: 'POST', body: fd, headers: { 'X-Visitor-Id': VID } });
        const data = await resp.json();
        if (!resp.ok) { alert(data.detail || '生成失败'); return; }
        $('imgCol').style.display = 'none';
        renderCopies(data);
        const pd = $('parsedDetail'); pd.innerHTML = '';
        $('resultWrap').style.display = 'block';
        $('resultWrap').scrollIntoView({ behavior: 'smooth' });
        refreshQuota();
      } catch (err) {
        alert('生成文案失败：' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '只生成文案';
      }
    }

    async function doImage() {
      const fd = collectForm();
      if (!fd) return;
      const btn = $('imgBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>生成图片中…';
      try {
        const resp = await fetch('/api/image', { method: 'POST', body: fd, headers: { 'X-Visitor-Id': VID } });
        const data = await resp.json();
        if (!resp.ok) { alert(data.detail || '生成失败'); return; }
        $('copyCol').style.display = 'none';
        renderImage(data);
        renderParsed(data);
        $('resultWrap').style.display = 'block';
        $('resultWrap').scrollIntoView({ behavior: 'smooth' });
        refreshQuota();
      } catch (err) {
        alert('生成图片失败：' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '只生成图片';
      }
    }

    $('copyBtn').addEventListener('click', doCopy);
    $('imgBtn').addEventListener('click', doImage);

    $('genBtn').addEventListener('click', async () => {
      const btn = $('genBtn');

      // 如果正在生成，点击 = 取消
      if (genAbort) {
        genAbort.abort();
        genAbort = null;
        btn.disabled = false;
        btn.innerHTML = '图文一起生成';
        return;
      }

      const fd = collectForm();
      if (!fd) return;

      genAbort = new AbortController();
      btn.disabled = false;
      btn.innerHTML = '<span class="spinner"></span>生成中，点击取消…';

      try {
        const resp = await fetch('/api/generate', { method: 'POST', body: fd, signal: genAbort.signal, headers: { 'X-Visitor-Id': VID } });
        const data = await resp.json();
        if (!resp.ok) { alert(data.detail || '生成失败'); return; }

        renderImage(data);
        renderCopies(data);
        renderParsed(data);

        $('resultWrap').style.display = 'block';
        $('resultWrap').scrollIntoView({ behavior: 'smooth' });
        refreshQuota();
      } catch (err) {
        if (err.name === 'AbortError') {
          // 用户主动取消，静默处理
        } else {
          alert('生成失败：' + err.message);
        }
      } finally {
        genAbort = null;
        btn.disabled = false;
        btn.innerHTML = '图文一起生成';
      }
    });

    // 多轮改图
    $('reviseBtn').addEventListener('click', async () => {
      const feedback = $('reviseInput').value.trim();
      if (!feedback) { alert('请输入修改意见'); return; }
      if (!currentPrompt) { alert('请先生成一张图再修改'); return; }

      const btn = $('reviseBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>修改中…';

      try {
        const resp = await fetch('/api/revise', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Visitor-Id': VID },
          body: JSON.stringify({ original_prompt: currentPrompt, feedback: feedback })
        });
        const data = await resp.json();
        if (!resp.ok) { alert(data.detail || '修改失败'); return; }

        if (data.image.base64) {
          $('resultImg').src = `data:image/${data.image.format};base64,${data.image.base64}`;
        } else if (data.image.url) {
          $('resultImg').src = data.image.url;
        }

        currentPrompt = data.new_prompt;
        const pd = $('parsedDetail');
        const box = pd.querySelector('.prompt-box');
        if (box) box.textContent = `最终提示词：${data.new_prompt}`;

        $('reviseInput').value = '';
        $('resultImg').scrollIntoView({ behavior: 'smooth' });
      } catch (err) {
        alert('修改失败：' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '修改图片';
      }
    });

    // ==================== 营销店长（对话式 + Agent 团队） ====================
    // Tab 切换
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const isKeeper = tab.dataset.tab === 'keeper';
        $('keeperView').style.display = isKeeper ? 'block' : 'none';
        $('materialView').style.display = isKeeper ? 'none' : 'block';
      });
    });

    // 欢迎时间戳
    if ($('welcomeTime')) {
      $('welcomeTime').textContent = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    }

    // ---- 聊天消息渲染 ----
    function addMsg(text, who) {
      const box = $('chatMessages');
      const div = document.createElement('div');
      div.className = 'msg ' + (who || 'keeper');
      const avatar = who === 'user' ? '👤' : '✦';
      div.innerHTML = `<div class="avatar">${avatar}</div><div class="bubble">${text}<div class="time">${new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })}</div></div>`;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
      return div;
    }
    function addKeeperMsg(html) {
      const box = $('chatMessages');
      const div = document.createElement('div');
      div.className = 'msg';
      div.innerHTML = `<div class="avatar">✦</div><div class="bubble">${html}<div class="time">${new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })}</div></div>`;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
      return div;
    }

    // ---- Agent 团队状态（按需动态渲染） ----
    const AGENT_META = {
      shop_analysis: { id: 'agentAnalysis', name: '📊 经营分析 Agent', desc: '分析热销/滞销 + 归因' },
      activity_plan: { id: 'agentActivity', name: '🎯 活动策划 Agent', desc: '策划方案 + 测算回本' },
      poster: { id: 'agentPoster', name: '🖼 海报生成 Agent', desc: '按定稿方案画海报' }
    };

    // 动态创建 Agent 卡片（只有被派活的才出现）
    function ensureAgentCard(key) {
      const meta = AGENT_META[key];
      if (!meta) return null;
      let card = document.getElementById(meta.id);
      if (!card) {
        card = document.createElement('div');
        card.className = 'agent-card';
        card.id = meta.id;
        card.innerHTML = `<div class="spin"></div><div><div class="name">${meta.name}</div><div class="status">待命</div></div>`;
        const panel = $('teamPanel');
        panel.style.display = 'flex';
        panel.appendChild(card);
      }
      return card;
    }

    function setAgentState(key, state) {
      const meta = AGENT_META[key];
      if (!meta) return;
      const card = ensureAgentCard(key);
      if (!card) return;
      const statusEl = card.querySelector('.status');
      const spinEl = card.querySelector('.spin');
      card.classList.remove('running', 'done', 'hidden');
      spinEl.textContent = '';
      if (state === 'running') {
        card.classList.add('running');
        statusEl.textContent = '运行中…';
      } else if (state === 'done') {
        card.classList.add('done');
        spinEl.textContent = '✓';
        statusEl.textContent = '已完成';
      } else {
        statusEl.textContent = '待命';
      }
    }

    // 清空团队面板（每次新任务开始时，先清掉上一次的 Agent 卡片）
    function resetAgents() {
      const panel = $('teamPanel');
      panel.innerHTML = '';
      panel.style.display = 'none';
    }

    // 店长「思考链路」气泡：先展示拆解过程，让用户知道谁在并行干活
    function addThinkBlock(lines) {
      const html = `<div class="think-block"><span class="think-label">🧠 店长思考</span>\n${lines.map(l => escapeHtml(l)).join('\n')}</div>`;
      addKeeperMsg(html);
    }

    // ---- 文件附件（表格 / 图片） ----
    let attachedFiles = [];  // {type:'csv'|'image', name, products?, base64?, previewUrl?}

    // 解析 CSV 文本 → products 数组（字段映射到后端 analyze_products 需要的格式）
    function parseCSV(text) {
      const lines = text.split(/\r?\n/).filter(l => l.trim());
      if (lines.length < 2) return [];
      const header = lines[0].split(',').map(h => h.trim().replace(/^["']|["']$/g, ''));
      // 字段名归一化
      const colMap = {};
      const norm = {
        'name': 'name', '名称': 'name', '产品': 'name', '产品名': 'name', '品名': 'name',
        'price': 'price', '价格': 'price', '售价': 'price', '单价': 'price',
        'cost': 'cost', '成本': 'cost', '食材成本': 'cost',
        'weekly_sales': 'weekly_sales', '周销量': 'weekly_sales', '销量': 'weekly_sales', '周销售': 'weekly_sales', 'sales': 'weekly_sales',
        'stock': 'stock', '库存': 'stock', '存货': 'stock',
        'rating': 'rating', '评分': 'rating', '口碑': 'rating',
        'menu_position': 'menu_position', '位置': 'menu_position', '排位': 'menu_position', '菜单位置': 'menu_position',
      };
      header.forEach((h, i) => {
        const k = norm[h.toLowerCase()] || norm[h];
        if (k) colMap[k] = i;
      });
      if (colMap.name === undefined || colMap.weekly_sales === undefined) return [];

      const products = [];
      for (let i = 1; i < lines.length; i++) {
        const cells = lines[i].split(',').map(c => c.trim().replace(/^["']|["']$/g, ''));
        if (!cells[colMap.name]) continue;
        const num = (v) => { const n = parseFloat(String(v).replace(/[^\d.-]/g, '')); return isNaN(n) ? 0 : n; };
        products.push({
          name: cells[colMap.name],
          category: '',
          price: num(cells[colMap.price]),
          cost: num(cells[colMap.cost]),
          weekly_sales: num(cells[colMap.weekly_sales]),
          stock: num(cells[colMap.stock]),
          rating: num(cells[colMap.rating]) || 4.0,
          menu_position: (colMap.menu_position !== undefined && cells[colMap.menu_position]) ? cells[colMap.menu_position] : '中部',
        });
      }
      return products;
    }

    function renderAttachStrip() {
      const strip = $('attachStrip');
      if (!attachedFiles.length) { strip.style.display = 'none'; strip.innerHTML = ''; return; }
      strip.style.display = 'flex';
      strip.innerHTML = '';
      attachedFiles.forEach((f, idx) => {
        const chip = document.createElement('div');
        chip.className = 'attach-chip';
        if (f.type === 'image') {
          chip.innerHTML = `<img src="${f.previewUrl}" alt="" /><span>${escapeHtml(f.name)}</span><span class="rm" data-idx="${idx}">✕</span>`;
        } else {
          chip.innerHTML = `<span>📊 ${escapeHtml(f.name)}（${f.products ? f.products.length + ' 款' : '解析失败'}）</span><span class="rm" data-idx="${idx}">✕</span>`;
        }
        strip.appendChild(chip);
      });
      strip.querySelectorAll('.rm').forEach(el => {
        el.addEventListener('click', () => { attachedFiles.splice(Number(el.dataset.idx), 1); renderAttachStrip(); });
      });
    }

    async function handleFiles(files) {
      for (const file of files) {
        const name = file.name || '文件';
        const isImage = /\.(png|jpe?g|webp)$/i.test(name);
        const isTable = /\.(csv|xlsx?|xls)$/i.test(name);
        if (!isImage && !isTable) { $('keeperHint').textContent = '只支持 CSV/Excel 表格或图片'; continue; }

        if (isImage) {
          const base64 = await new Promise((res) => {
            const r = new FileReader();
            r.onload = () => res(String(r.result).split(',')[1]);
            r.readAsDataURL(file);
          });
          const previewUrl = await new Promise((res) => {
            const r = new FileReader();
            r.onload = () => res(r.result);
            r.readAsDataURL(file);
          });
          attachedFiles.push({ type: 'image', name, base64, previewUrl });
          $('keeperHint').textContent = '已附加图片，发送后可反推海报风格';
        } else {
          let products = [];
          if (/\.csv$/i.test(name)) {
            const text = await file.text();
            products = parseCSV(text);
          } else {
            // xlsx 需要解析，先提示；暂用 SheetJS 或降级提示
            $('keeperHint').textContent = 'Excel 请另存为 CSV 后拖入（当前版本直接支持 CSV）';
            continue;
          }
          if (products.length) {
            attachedFiles.push({ type: 'table', name, products });
            $('keeperHint').textContent = `已解析表格：${products.length} 款产品`;
          } else {
            $('keeperHint').textContent = '表格解析失败：请确认表头含「名称」和「销量」列';
          }
        }
      }
      renderAttachStrip();
    }

    // ---- 发送消息 + 调度 ----
    async function sendKeeper() {
      const input = $('keeperInput');
      const msg = input.value.trim();
      const hasFiles = attachedFiles.length > 0;
      if (!msg && !hasFiles) return;
      // 有附件但没文字时，给个默认意图提示
      const finalMsg = msg || (attachedFiles.some(f => f.type === 'table') ? '帮我分析这份产品数据' : '帮我参考这张图做海报');
      input.value = '';
      addMsg(finalMsg, 'user');

      const btn = $('keeperBtn');
      btn.disabled = true;
      btn.textContent = '思考中…';

      // 先清掉上一次的 Agent 面板
      resetAgents();

      // 组装请求参数
      let products = [];
      let refImage = '';
      for (const f of attachedFiles) {
        if (f.type === 'table') products = f.products || [];
        if (f.type === 'image') refImage = f.base64 || '';
      }

      // 前端先做一次「意图预判」
      const activityKw = ['活动', '促销', '回本', '清库存', '拉新', '冲销量', '满减', '买一送一', '折扣', '定价', '策划'];
      const analysisKw = ['分析', '滞销', '热销', '卖得', '诊断', '经营', '生意', '卖不动', '库存', '哪些', '什么'];
      const posterKw = ['海报', '图片', '图', '参考', '风格'];
      const preAnalysis = products.length > 0 || analysisKw.some(k => finalMsg.includes(k));
      const preActivity = activityKw.some(k => finalMsg.includes(k));
      const prePoster = refImage !== '' || posterKw.some(k => finalMsg.includes(k));

      // 店长思考链路
      if (preAnalysis || preActivity || prePoster) {
        const thinkLines = [];
        if (preAnalysis) thinkLines.push(products.length > 0 ? '· 让「经营分析 Agent」用你上传的表格分析热销/滞销' : '· 让「经营分析 Agent」盘点店内热销/滞销');
        if (preActivity) thinkLines.push('· 让「活动策划 Agent」出方案并测算回本');
        if (prePoster) thinkLines.push('· 让「海报生成 Agent」反推参考图风格，生成新海报');
        const n = (preAnalysis ? 1 : 0) + (preActivity ? 1 : 0) + (prePoster ? 1 : 0);
        if (n > 1) thinkLines.unshift(`这个需求要 ${n} 个 Agent 同时协作，我让它们并行开工：`);
        else thinkLines.unshift('我拆解了一下你的需求：');
        addThinkBlock(thinkLines);
        if (preAnalysis) setAgentState('shop_analysis', 'running');
        if (preActivity) setAgentState('activity_plan', 'running');
        if (prePoster) setAgentState('poster', 'running');
      } else {
        addThinkBlock(['· 这是对刚才方案的追问，我结合上下文直接回答']);
      }

      try {
        const resp = await fetch('/api/keeper_chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: finalMsg, products: products, ref_image: refImage })
        });
        const data = await resp.json();

        // 标记完成
        (data.agents || []).forEach(a => setAgentState(a, 'done'));

        // 店长回复
        addKeeperMsg(escapeHtml(data.reply || ''));

        // 渲染经营分析结果
        if (data.analysis && !data.analysis.error) {
          addKeeperMsg(renderAnalysisHtml(data.analysis));
        }

        // 渲染活动策划结果 + 「画海报」确认按钮
        if (data.activity && !data.activity.error) {
          const div = addKeeperMsg(renderActivityHtml(data.activity));
          div.querySelectorAll('.poster-trigger').forEach(b => {
            b.addEventListener('click', () => {
              const planName = b.dataset.plan;
              const planDesc = b.dataset.desc || '';
              confirmPoster(planName, planDesc);
            });
          });
        }

        // 渲染海报结果
        if (data.poster && !data.poster.error) {
          let html = '<b>🖼 海报生成结果</b><br>';
          if (data.poster.image && data.poster.image.base64) {
            html += `<img src="data:image/${data.poster.image.format};base64,${data.poster.image.base64}" style="max-width:100%;border-radius:12px;margin-top:8px;border:1px solid var(--border)" />`;
          } else if (data.poster.image && data.poster.image.url) {
            html += `<img src="${data.poster.image.url}" style="max-width:100%;border-radius:12px;margin-top:8px;border:1px solid var(--border)" />`;
          } else {
            html += '（生图失败，请稍后重试）';
          }
          addKeeperMsg(html);
        }
      } catch (err) {
        addKeeperMsg('抱歉，出了点问题：' + escapeHtml(err.message));
      } finally {
        // 清空附件，准备下一轮
        attachedFiles = [];
        renderAttachStrip();
        btn.disabled = false;
        btn.textContent = '发送';
      }
    }

    // ---- 商家确认后画海报 ----
    async function confirmPoster(planName, planDesc) {
      addKeeperMsg(`好的，我让海报 Agent 按「<b>${escapeHtml(planName)}</b>」方案画海报，请稍候…`);
      setAgentState('poster', 'running');
      try {
        const resp = await fetch('/api/keeper_poster', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ plan_name: planName, plan_desc: planDesc, product_name: '招牌珍珠奶茶' })
        });
        const data = await resp.json();
        setAgentState('poster', 'done');
        let html = '海报生成好了：<br>';
        if (data.image && data.image.base64) {
          html += `<img src="data:image/${data.image.format};base64,${data.image.base64}" style="max-width:100%;border-radius:12px;margin-top:8px;border:1px solid var(--border)" />`;
        } else if (data.image && data.image.url) {
          html += `<img src="${data.image.url}" style="max-width:100%;border-radius:12px;margin-top:8px;border:1px solid var(--border)" />`;
        } else {
          html += '（生图失败，请稍后重试）';
        }
        addKeeperMsg(html);
      } catch (err) {
        addKeeperMsg('画海报失败：' + escapeHtml(err.message));
      }
    }

    // ---- 结果渲染（返回 HTML 字符串，插入对话气泡） ----
    function renderAnalysisHtml(data) {
      let html = '<b>📊 经营分析结果</b><br>';
      if (data.summary) html += escapeHtml(data.summary) + '<br><br>';
      const rankLine = (list, label) => list.map(p =>
        `${label} #${p.sales_rank} ${escapeHtml(p.name)}（周销 ${p.weekly_sales}，毛利 ${p.gross_margin}%）`
      ).join('<br>');
      html += `<b>热销</b><br>${rankLine(data.hot || [], '热销')}<br><br>`;
      html += `<b>滞销</b><br>${rankLine(data.slow || [], '滞销')}<br><br>`;
      if (data.conclusions && data.conclusions.length) {
        html += '<b>滞销归因与对策</b><br>';
        for (const c of data.conclusions) {
          html += `· <b>${escapeHtml(c.name)}</b>：${escapeHtml(c.reasoning || '')}<br>&nbsp;&nbsp;💡 ${escapeHtml(c.suggestion || '')}<br><br>`;
        }
      }
      return html;
    }

    function renderActivityHtml(data) {
      let html = '<b>🎯 活动策划结果</b><br>';
      if (data.summary) html += escapeHtml(data.summary) + '<br><br>';
      for (const p of (data.plans || [])) {
        const profit = p.net_profit >= 0 ? `+${p.net_profit} 元` : `${p.net_profit} 元`;
        const profitColor = p.net_profit >= 0 ? '#cd785c' : '#5aae72';
        const be = (p.break_even_volume !== null && p.break_even_volume !== undefined) ? `${p.break_even_volume} 杯` : '无法回本';
        html += `<div style="border:1px solid var(--border);border-radius:10px;padding:10px;margin:8px 0;background:#fff">
          <b>${escapeHtml(p.name)}</b> <span style="color:${profitColor};font-weight:700">${profit}</span><br>
          <span style="font-size:12px;color:var(--muted)">${escapeHtml(p.desc || '')}</span><br>
          <span style="font-size:12px;color:var(--muted)">预计销量 ${p.expected_volume} 杯 · 预算 ${p.budget} 元 · 毛利 ${p.total_gross} 元 · 回本需 ${be}</span><br>
          <button class="poster-trigger" data-plan="${escapeHtml(p.name)}" data-desc="${escapeHtml(p.desc || '')}" style="margin-top:6px;padding:6px 14px;border-radius:8px;border:1px solid var(--accent);background:#fff;color:var(--accent);font-size:12.5px;cursor:pointer;font-family:inherit">🖼 按此方案画海报</button>
        </div>`;
      }
      if (data.interpretation) {
        html += `<div style="background:#fdf6ef;border-radius:10px;padding:10px;margin-top:8px"><b>店长建议</b><br>${escapeHtml(data.interpretation)}</div>`;
      }
      return html;
    }

    function escapeHtml(s) {
      if (!s) return '';
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // 发送按钮 + 回车
    $('keeperBtn').addEventListener('click', sendKeeper);
    $('keeperInput').addEventListener('keydown', e => { if (e.key === 'Enter') sendKeeper(); });

    // ---- 附件：点击 📎 选文件 + 拖拽进输入区 ----
    $('attachBtn').addEventListener('click', () => $('fileInput').click());
    $('fileInput').addEventListener('change', (e) => { handleFiles(e.target.files); e.target.value = ''; });

    const inputBar = document.querySelector('.chat-input-bar');
    const chatBox = document.querySelector('.chat-box');
    ['dragover', 'dragenter'].forEach(ev => {
      chatBox.addEventListener(ev, (e) => { e.preventDefault(); inputBar.classList.add('dragover'); });
    });
    ['dragleave', 'drop'].forEach(ev => {
      chatBox.addEventListener(ev, (e) => { e.preventDefault(); inputBar.classList.remove('dragover'); });
    });
    chatBox.addEventListener('drop', (e) => {
      if (e.dataTransfer && e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
    });

    // ---- 语音输入（Web Speech API，支持续说累积） ----
    const micBtn = $('micBtn');
    let recognition = null;
    let voiceBuffer = '';  // 累积本次会话的语音文本
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SR();
      recognition.lang = 'zh-CN';
      recognition.continuous = true;   // 连续识别，停一下不会结束
      recognition.interimResults = true;  // 实时显示中间结果
      recognition.onresult = (e) => {
        // 从当前结果里取最新 final 文本，追加到 buffer
        let finalText = '';
        let interimText = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const r = e.results[i];
          if (r.isFinal) finalText += r[0].transcript;
          else interimText += r[0].transcript;
        }
        if (finalText) voiceBuffer += finalText;
        // 输入框实时显示：已有 buffer + 当前中间结果
        $('keeperInput').value = (voiceBuffer + interimText).trim();
        $('keeperHint').textContent = '正在听（说完可继续说，点麦克风结束）…';
      };
      recognition.onerror = (e) => {
        micBtn.classList.remove('recording');
        $('keeperHint').textContent = '语音识别失败：' + e.error;
      };
      recognition.onend = () => {
        micBtn.classList.remove('recording');
        if (voiceBuffer) {
          $('keeperHint').textContent = '已识别，可继续点麦克风补充，或直接发送';
        }
      };
    }

    micBtn.addEventListener('click', () => {
      if (!recognition) {
        $('keeperHint').textContent = '当前浏览器不支持语音输入（建议用 Chrome / Edge）';
        return;
      }
      if (micBtn.classList.contains('recording')) {
        // 结束：把 buffer 定稿到输入框，清空 buffer
        recognition.stop();
        micBtn.classList.remove('recording');
        voiceBuffer = '';
      } else {
        try {
          // 不清空输入框，保留已有内容，实现「在后面继续补充」
          if (!$('keeperInput').value.trim()) voiceBuffer = '';
          recognition.start();
          micBtn.classList.add('recording');
          $('keeperHint').textContent = '正在听，请说话…';
        } catch (e) {
          $('keeperHint').textContent = '启动语音失败，请重试';
        }
      }
    });
  </script>
</body>
</html>
