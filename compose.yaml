# Local deployment rehearsal only: API is bound to loopback, database has no host port.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: brandpilot
      POSTGRES_USER: brandpilot
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in private .env.deploy}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U brandpilot -d brandpilot"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    env_file: .env.deploy
    environment:
      AUTH_MODE: session
      DB_HOST: db
      DB_USER: brandpilot
      DB_NAME: brandpilot
      APP_DATA_DIR: /data
      BRAND_STORAGE_DIR: /data/brand-files
      WORKSPACE_LOCAL_ONLY: 'false'
      APP_ACCESS_KEY: ''
      SEED_DEMO_DATA: 'false'
    ports:
      - '127.0.0.1:8021:8000'
    volumes:
      - files:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 150s
volumes:
  database:
  files:
